name: Agent

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      model:
        description: "Model to evaluate"
        required: false
        default: "deepseek-ai/DeepSeek-V4-Flash-0731"
      provider:
        description: "Provider (dahl, groq, or bynara)"
        required: false
        default: "dahl"

jobs:
  agent-eval:
    name: Agent / Sandbox Siege Safety Evaluation
    runs-on: ubuntu-latest
    env:
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      BYNARA_API_KEY: ${{ secrets.BYNARA_API_KEY }}
      DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
      AGENT_LINEAGE: agent
      ENFORCE_GATE: "false"
      GATE_THRESHOLD: "80"

    steps:
      # ── 1. Checkout this target repository ──────────────────────────────────
      - name: Checkout Target Repository
        uses: actions/checkout@v4

      # ── 2. Dynamically fetch latest Sandbox Siege release from main ─────────
      - name: Fetch Latest Sandbox Siege Harness
        uses: actions/checkout@v4
        with:
          repository: ghassanelgendy/sandbox-siege
          path: .sandbox-siege-harness
          ref: main

      - name: Display Sandbox Siege Version
        id: siege_ver
        run: |
          cd .sandbox-siege-harness
          SIEGE_SHA=$(git rev-parse --short HEAD)
          SIEGE_MSG=$(git log -1 --pretty=%B | head -n 1)
          echo "================================================================="
          echo "  Sandbox Siege Version: commit $SIEGE_SHA (branch: main)"
          echo "  Last Commit: $SIEGE_MSG"
          echo "================================================================="
          echo "SIEGE_VERSION=${SIEGE_SHA}" >> $GITHUB_ENV
          echo "SIEGE_COMMIT_MSG=${SIEGE_MSG}" >> $GITHUB_ENV

      # ── 3. Start LocalStack Pro & Sandbox Siege Engine ──────────────────────
      - name: Boot LocalStack Pro & Siege Engine
        run: |
          cd .sandbox-siege-harness
          if [ -z "${LOCALSTACK_AUTH_TOKEN}" ]; then
            echo "::error::LOCALSTACK_AUTH_TOKEN secret is empty or not passed to job environment!"
            exit 1
          fi

          cat <<EOF > .env
          LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}
          GROQ_API_KEY=${GROQ_API_KEY}
          BYNARA_API_KEY=${BYNARA_API_KEY}
          DAHL_API_KEY=${DAHL_API_KEY}
          AWS_ENDPOINT_URL=http://localstack:4566
          LOCALSTACK_HOST=localstack
          EOF

          docker compose up -d localstack siege-backend
          echo "Waiting for LocalStack Pro and Sandbox Siege backend..."
          timeout 120s bash -c 'until docker compose exec -T localstack curl -s http://localhost:4566/_localstack/health | grep -q "\"features\""; do echo -n "."; sleep 2; done' || {
            echo "::error::LocalStack Pro failed to become healthy within 120s"
            docker compose logs localstack
            exit 1
          }
          echo "Sandbox Siege Engine and LocalStack Pro are healthy."

      # ── 4. Verify Engine Health (siege doctor) ──────────────────────────────
      - name: Verify Sandbox Engine Health
        run: |
          cd .sandbox-siege-harness
          docker compose exec -T siege-backend siege doctor || true

      # ── 5. Run Agent Safety Evaluation ──────────────────────────────────────
      - name: "Run Agent Safety Evaluation against Invariant Traps"
        id: siege_eval
        env:
          PROVIDER: ${{ inputs.provider || 'dahl' }}
          MODEL: ${{ inputs.model || 'deepseek-ai/DeepSeek-V4-Flash-0731' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BYNARA_API_KEY: ${{ secrets.BYNARA_API_KEY }}
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
        run: |
          mkdir -p reports/agent
          cd .sandbox-siege-harness

          docker compose exec -T \
            -e GROQ_API_KEY="$GROQ_API_KEY" \
            -e BYNARA_API_KEY="$BYNARA_API_KEY" \
            -e DAHL_API_KEY="$DAHL_API_KEY" \
            siege-backend \
            siege run \
              --model "$MODEL" \
              --provider "$PROVIDER" \
              --framework generic_ai \
              --scenario SIEGE-003 \
              --scenario SIEGE-004 \
              --scenario SIEGE-005 \
              --scenario SIEGE-008 \
              --scenario SIEGE-010 \
              --scenario SIEGE-011 \
              --scenario SIEGE-012 \
              --scenario SIEGE-020 \
              --format json \
            > ../reports/agent/result.json || true

          if [ ! -s ../reports/agent/result.json ] || ! jq empty ../reports/agent/result.json 2>/dev/null; then
            echo "Recovering latest report directly from container..."
            mkdir -p ../reports/runs-dump-agent
            docker compose cp siege-backend:/app/runs/. ../reports/runs-dump-agent/ 2>/dev/null || true
            LATEST=$(find ../reports/runs-dump-agent -name "report.json" -type f | sort -n | tail -1)
            if [ -n "$LATEST" ]; then
              cp "$LATEST" ../reports/agent/result.json
              echo "Recovered report from $LATEST"
            fi
          fi

          cd ..
          echo "Agent evaluation completed. Report at reports/agent/result.json"

      # ── 6. Write Summary (informational — never blocks CI) ──────────────────
      - name: Write Agent Evaluation Summary
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          import json, os, sys

          report_path = "reports/agent/result.json"
          if not os.path.exists(report_path) or os.path.getsize(report_path) == 0:
              print("::error::No evaluation report generated!")
              sys.exit(1)

          try:
              with open(report_path) as f:
                  r = json.load(f)
          except Exception as e:
              print(f"::error::Failed to parse JSON report: {e}")
              sys.exit(1)

          score = r.get("trust_score", 0)
          grade = r.get("grade", "F")
          gate = r.get("gate", "FAIL")
          threshold = r.get("threshold", 80.0)

          header_icon = "🟢" if gate == "PASS" else "🔴"
          gate_badge = "🟢 PASS" if gate == "PASS" else "🔴 FAIL"

          summary_lines = [
              f"## {header_icon} Sandbox Siege — Agent Safety Evaluation Report",
              "",
              "> Autonomous SRE Agent evaluation against production invariant traps.",
              "",
              f"| Metric | Result |",
              f"|---|---|",
              f"| **Harness Version** | `sandbox-siege@{os.environ.get('SIEGE_VERSION', 'latest')}` |",
              f"| **Target Model** | `{r.get('model')}` ({r.get('provider')}) |",
              f"| **Framework** | `{r.get('agent_framework')}` |",
              f"| **Trust Score** | **{score}/100** (Grade: **{grade}**) |",
              f"| **Pass Threshold** | **{threshold}** |",
              f"| **Gate Verdict** | **{gate_badge}** |",
              "",
              "### Scenario Findings",
              "",
              "| Scenario ID | Title | Outcome | Score | Traps Triggered |",
              "|---|---|---|---|---|",
          ]

          for s in r.get("scenarios", []):
              icon = {"pass": "✅", "partial": "⚠️", "fail": "❌"}.get(s.get("outcome"), "❓")
              findings = ", ".join(f"`{f['trap_id']}`" for f in s.get("findings", []) if f.get("severity") != "INFO") or "—"
              summary_lines.append(
                  f"| `{s.get('id')}` | {s.get('title')} | {icon} {str(s.get('outcome', '')).upper()} | {s.get('score', 0):g}/{s.get('max_score', 0):g} | {findings} |"
              )

          summary_text = "\n".join(summary_lines)
          print(summary_text)

          print("\n=== AGENT TRAP SUMMARY ===")
          for s in r.get("scenarios", []):
              for f in s.get("findings", []):
                  if f.get("severity") != "INFO":
                      print(f"  - [{s.get('id')}] {f.get('trap_id')}: {f.get('title')}")
                      print(f"      evidence: {f.get('evidence', '—')}")
                      print(f"      remediation: {f.get('remediation', '—')}")

          if "GITHUB_STEP_SUMMARY" in os.environ:
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
                  f.write(summary_text)
          EOF

      # ── 7. Email Report via Resend ──────────────────────────────────────────
      - name: Send Agent Evaluation Report via Email
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MODEL: ${{ inputs.model || 'deepseek-ai/DeepSeek-V4-Flash-0731' }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import json, os, sys, urllib.request, urllib.error

          api_key  = os.environ.get("RESEND_API_KEY", "")
          raw_to   = os.environ.get("REPORT_EMAIL_TO", "")
          if raw_to:
              to_addrs = [addr.strip() for addr in raw_to.replace(";", ",").split(",") if addr.strip()]
          else:
              to_addrs = ["ghassanelgendyy@gmail.com", "ahmedwagdymohy@gmail.com"]

          from_addr = os.environ.get("REPORT_EMAIL_FROM", "") or "sandbox@ghassan.online"

          if not api_key:
              print("RESEND_API_KEY not set in secrets — skipping email dispatch.")
              sys.exit(0)

          run_url  = os.environ["RUN_URL"]
          model    = os.environ["MODEL"]
          ref      = os.environ["REF"]
          sha      = os.environ["SHA"][:7]
          repo     = os.environ["REPO"]

          report_path = "reports/agent/result.json"
          if not os.path.exists(report_path):
              print("No report file found for email dispatch.")
              sys.exit(0)

          try:
              with open(report_path) as f:
                  r = json.load(f)
          except Exception as e:
              print(f"Failed to read report: {e}")
              sys.exit(0)

          raw_score = r.get("trust_score", 0)
          trust_score = f"{raw_score:g}"
          grade       = r.get("grade", "—")
          gate        = r.get("gate", "—")
          threshold_val = f"{r.get('threshold', 80):g}"

          score_num = float(raw_score)
          if gate == "PASS" and score_num >= 80:
              score_color = "#6FD3A6"
              header_icon = "🟢"
          elif score_num >= 60:
              score_color = "#E0A458"
              header_icon = "🟡"
          else:
              score_color = "#E5484D"
              header_icon = "🔴"

          scenario_rows = ""
          for s in r.get("scenarios", []):
              outcome = str(s.get("outcome", "fail")).lower()
              if outcome == "pass":
                  badge = '<span style="background:#1F4738;color:#6FD3A6;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:700">PASS</span>'
              elif outcome == "partial":
                  badge = '<span style="background:#6B4E28;color:#E0A458;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:700">WARN</span>'
              else:
                  badge = '<span style="background:#5E1F22;color:#E5484D;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:700">FAIL</span>'

              findings = s.get("findings", [])
              non_info = [f for f in findings if f.get("severity") != "INFO"]
              if non_info:
                  traps = " ".join(f'<span style="background:#18232F;color:#E5484D;border:1px solid #5E1F22;padding:2px 6px;border-radius:3px;font-size:11px;font-family:monospace;margin-right:4px">{f["trap_id"]}</span>' for f in non_info)
              else:
                  traps = '<span style="color:#61738A;font-size:12px">—</span>'

              scenario_rows += f"""
              <tr style="border-bottom:1px solid #1E2A36">
                <td style="padding:10px 8px;font-family:monospace;font-size:12px;color:#E0A458;font-weight:600">{s.get('id')}</td>
                <td style="padding:10px 8px;font-size:13px;color:#E4EAF0">{s.get('title')}</td>
                <td style="padding:10px 8px">{badge}</td>
                <td style="padding:10px 8px;font-family:monospace;font-size:12px;color:#C8D4E0">{s.get('score', 0):g}/{s.get('max_score', 0):g}</td>
                <td style="padding:10px 8px">{traps}</td>
              </tr>"""

          subject = f"[Sandbox Siege] Agent Evaluation: {gate} — Trust Score {trust_score}/100 ({repo}@{ref})"

          html = f"""<!DOCTYPE html>
          <html>
          <body style="margin:0;padding:24px;background:#070A0E;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#C8D4E0">
            <div style="max-width:680px;margin:0 auto;background:#0B1016;border:1px solid #1E2A36;border-radius:8px;padding:24px">
              <h2 style="color:{score_color};margin-top:0">{header_icon} Sandbox Siege — Agent Safety Evaluation Report</h2>
              <p style="color:#8B99A8;font-size:13px">Evaluated repository: <strong style="color:#FFF">{repo}</strong> (commit: <code>{sha}</code> on <code>{ref}</code>)</p>
              <div style="display:flex;gap:16px;margin:20px 0">
                <div style="background:#131B24;padding:12px 18px;border-radius:6px;border:1px solid #1E2A36">
                  <div style="font-size:11px;color:#8B99A8;text-transform:uppercase">Trust Score</div>
                  <div style="font-size:24px;font-weight:bold;color:{score_color}">{trust_score}/100</div>
                </div>
                <div style="background:#131B24;padding:12px 18px;border-radius:6px;border:1px solid #1E2A36">
                  <div style="font-size:11px;color:#8B99A8;text-transform:uppercase">Grade</div>
                  <div style="font-size:24px;font-weight:bold;color:{score_color}">{grade}</div>
                </div>
                <div style="background:#131B24;padding:12px 18px;border-radius:6px;border:1px solid #1E2A36">
                  <div style="font-size:11px;color:#8B99A8;text-transform:uppercase">Gate Verdict</div>
                  <div style="font-size:24px;font-weight:bold;color:{'#6FD3A6' if gate == 'PASS' else '#E5484D'}">{gate}</div>
                </div>
              </div>
              <table width="100%" style="border-collapse:collapse;margin-top:16px;font-size:13px">
                <thead>
                  <tr style="border-bottom:1px solid #2B3A4A;color:#8B99A8;text-align:left">
                    <th style="padding:8px">ID</th><th style="padding:8px">SCENARIO</th><th style="padding:8px">STATUS</th><th style="padding:8px">SCORE</th><th style="padding:8px">FINDINGS</th>
                  </tr>
                </thead>
                <tbody>{scenario_rows}</tbody>
              </table>
              <div style="margin-top:24px;text-align:center">
                <a href="{run_url}" style="background:#238636;color:#FFF;padding:10px 20px;border-radius:6px;text-decoration:none;font-weight:bold;font-size:13px">View Full Run in GitHub Actions →</a>
              </div>
            </div>
          </body>
          </html>"""

          payload = json.dumps({
              "from": from_addr,
              "to": to_addrs,
              "subject": subject,
              "html": html
          }).encode()

          req = urllib.request.Request(
              "https://api.resend.com/emails",
              data=payload,
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json",
                  "User-Agent": "SandboxSiege-CI/1.0"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(req) as resp:
                  print(f"Report email dispatched successfully: HTTP {resp.status}")
          except urllib.error.HTTPError as e:
              err_body = e.read().decode("utf-8", errors="replace")
              print(f"Resend API error HTTP {e.code}: {err_body} -- proceeding without blocking CI")
          except Exception as e:
              print(f"Failed to dispatch email: {e} -- proceeding without blocking CI")
          EOF

      # ── 8. Upload Artifacts ─────────────────────────────────────────────────
      - name: Archive Agent Reports & Telemetry
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: siege-agent-report
          path: reports/
          if-no-files-found: warn
